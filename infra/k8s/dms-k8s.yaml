# ═══════════════════════════════════════════════════════════
#  DocVault DMS — Kubernetes Production Manifests
# ═══════════════════════════════════════════════════════════

# ── PostgreSQL ──
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  labels:
    app: docvault
    component: database
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: docvault
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docvault
      component: database
  template:
    metadata:
      labels:
        app: docvault
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - { name: POSTGRES_DB, value: dms }
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD, value: postgres }
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: pg-storage
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "512Mi", cpu: "500m" }
      volumes:
        - name: pg-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: docvault
    component: database
  ports:
    - port: 5432
      targetPort: 5432

---
# ── Zookeeper ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  labels:
    app: docvault
    component: zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docvault
      component: zookeeper
  template:
    metadata:
      labels:
        app: docvault
        component: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          env:
            - { name: ZOOKEEPER_CLIENT_PORT, value: "2181" }
            - { name: ZOOKEEPER_TICK_TIME, value: "2000" }
          ports:
            - containerPort: 2181
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "512Mi", cpu: "500m" }
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
spec:
  selector:
    app: docvault
    component: zookeeper
  ports:
    - port: 2181
      targetPort: 2181

---
# ── Kafka ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: docvault
    component: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docvault
      component: kafka
  template:
    metadata:
      labels:
        app: docvault
        component: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          env:
            - { name: KAFKA_BROKER_ID, value: "1" }
            - { name: KAFKA_ZOOKEEPER_CONNECT, value: "zookeeper-service:2181" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka-service:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
          ports:
            - containerPort: 9092
          resources:
            requests: { memory: "256Mi", cpu: "200m" }
            limits: { memory: "1Gi", cpu: "1000m" }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
spec:
  selector:
    app: docvault
    component: kafka
  ports:
    - port: 9092
      targetPort: 9092

---
# ── MinIO (S3 Storage) ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app: docvault
    component: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docvault
      component: storage
  template:
    metadata:
      labels:
        app: docvault
        component: storage
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER, value: minioadmin }
            - { name: MINIO_ROOT_PASSWORD, value: minioadmin }
          ports:
            - containerPort: 9000
            - containerPort: 9001
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "512Mi", cpu: "500m" }
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
spec:
  selector:
    app: docvault
    component: storage
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001

---
# ── Documents Service ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: documents-service
  labels:
    app: docvault
    component: documents
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docvault
      component: documents
  template:
    metadata:
      labels:
        app: docvault
        component: documents
    spec:
      containers:
        - name: documents
          image: dms-documents:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - { name: POSTGRES_HOST, value: postgres-service }
            - { name: POSTGRES_PORT, value: "5432" }
            - { name: POSTGRES_DB, value: dms }
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD, value: postgres }
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka-service:9092" }
            - { name: KAFKA_TOPIC_DOCUMENTS_UPLOADED, value: "dms.documents.uploaded" }
            - { name: S3_ENDPOINT, value: "http://minio-service:9000" }
            - { name: S3_ACCESS_KEY, value: minioadmin }
            - { name: S3_SECRET_KEY, value: minioadmin }
            - { name: S3_BUCKET, value: dms-documents }
          resources:
            requests: { memory: "256Mi", cpu: "200m" }
            limits: { memory: "512Mi", cpu: "500m" }
          readinessProbe:
            httpGet: { path: /api/documents/health, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/documents/health, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: documents-service
spec:
  selector:
    app: docvault
    component: documents
  ports:
    - port: 8081
      targetPort: 8081

---
# ── Comments Service ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comments-service
  labels:
    app: docvault
    component: comments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docvault
      component: comments
  template:
    metadata:
      labels:
        app: docvault
        component: comments
    spec:
      containers:
        - name: comments
          image: dms-comments:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "300m" }
---
apiVersion: v1
kind: Service
metadata:
  name: comments-service
spec:
  selector:
    app: docvault
    component: comments
  ports:
    - port: 8082
      targetPort: 8082

---
# ── Translator Service (Python + Gemini AI) ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: translator-service
  labels:
    app: docvault
    component: translator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docvault
      component: translator
  template:
    metadata:
      labels:
        app: docvault
        component: translator
    spec:
      containers:
        - name: translator
          image: dms-translator:latest
          imagePullPolicy: Never
          env:
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka-service:9092" }
            - { name: KAFKA_GROUP_ID, value: "translator-service" }
            - { name: KAFKA_INPUT_TOPIC, value: "dms.documents.uploaded" }
            - { name: KAFKA_OUTPUT_TOPIC, value: "dms.documents.translated" }
            - { name: GEMINI_API_KEY, value: "" }
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "256Mi", cpu: "300m" }

---
# ── Translation Consumer Service (Python → PostgreSQL) ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: translation-consumer
  labels:
    app: docvault
    component: translation-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docvault
      component: translation-consumer
  template:
    metadata:
      labels:
        app: docvault
        component: translation-consumer
    spec:
      containers:
        - name: translation-consumer
          image: dms-translation-consumer:latest
          imagePullPolicy: Never
          env:
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka-service:9092" }
            - { name: KAFKA_GROUP_ID, value: "translation-consumer" }
            - { name: KAFKA_INPUT_TOPIC, value: "dms.documents.translated" }
            - { name: POSTGRES_HOST, value: postgres-service }
            - { name: POSTGRES_PORT, value: "5432" }
            - { name: POSTGRES_DB, value: dms }
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD, value: postgres }
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "256Mi", cpu: "300m" }

---
# ── API Gateway ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: docvault
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docvault
      component: gateway
  template:
    metadata:
      labels:
        app: docvault
        component: gateway
    spec:
      containers:
        - name: gateway
          image: dms-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - { name: DOCUMENTS_SERVICE_URL, value: "http://documents-service:8081" }
            - { name: COMMENTS_SERVICE_URL, value: "http://comments-service:8082" }
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "300m" }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  selector:
    app: docvault
    component: gateway
  ports:
    - port: 8080
      targetPort: 8080

---
# ── Frontend ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-ui
  labels:
    app: docvault
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docvault
      component: frontend
  template:
    metadata:
      labels:
        app: docvault
        component: frontend
    spec:
      containers:
        - name: dms-ui
          image: dms-ui:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests: { memory: "32Mi", cpu: "25m" }
            limits: { memory: "64Mi", cpu: "100m" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dms-ui-service
spec:
  type: NodePort
  selector:
    app: docvault
    component: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
