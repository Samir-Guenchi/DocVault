# ═══════════════════════════════════════════════════════════
#  DocVault DMS — Kubernetes Production Manifests
# ═══════════════════════════════════════════════════════════

# ── PostgreSQL ──
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  labels:
    app: docvault
    component: database
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: docvault
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docvault
      component: database
  template:
    metadata:
      labels:
        app: docvault
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - { name: POSTGRES_DB, value: dms }
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD, value: postgres }
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: pg-storage
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "512Mi", cpu: "500m" }
      volumes:
        - name: pg-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: docvault
    component: database
  ports:
    - port: 5432
      targetPort: 5432

---
# ── Documents Service ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: documents-service
  labels:
    app: docvault
    component: documents
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docvault
      component: documents
  template:
    metadata:
      labels:
        app: docvault
        component: documents
    spec:
      containers:
        - name: documents
          image: dms-documents:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - { name: POSTGRES_HOST, value: postgres-service }
            - { name: POSTGRES_PORT, value: "5432" }
            - { name: POSTGRES_DB, value: dms }
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD, value: postgres }
          resources:
            requests: { memory: "256Mi", cpu: "200m" }
            limits: { memory: "512Mi", cpu: "500m" }
          readinessProbe:
            httpGet: { path: /api/documents/health, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/documents/health, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: documents-service
spec:
  selector:
    app: docvault
    component: documents
  ports:
    - port: 8081
      targetPort: 8081

---
# ── API Gateway ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: docvault
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docvault
      component: gateway
  template:
    metadata:
      labels:
        app: docvault
        component: gateway
    spec:
      containers:
        - name: gateway
          image: dms-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - { name: DOCUMENTS_SERVICE_URL, value: "http://documents-service:8081" }
            - { name: COMMENTS_SERVICE_URL, value: "http://comments-service:8082" }
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "300m" }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  selector:
    app: docvault
    component: gateway
  ports:
    - port: 8080
      targetPort: 8080

---
# ── Frontend ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-ui
  labels:
    app: docvault
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docvault
      component: frontend
  template:
    metadata:
      labels:
        app: docvault
        component: frontend
    spec:
      containers:
        - name: dms-ui
          image: dms-ui:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests: { memory: "32Mi", cpu: "25m" }
            limits: { memory: "64Mi", cpu: "100m" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dms-ui-service
spec:
  type: NodePort
  selector:
    app: docvault
    component: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
