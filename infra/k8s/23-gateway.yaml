# ═══════════════════════════════════════════════════════════
# API Gateway (Spring Cloud Gateway)
# ═══════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: docvault
  labels:
    app: docvault
    component: gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: docvault
      component: gateway
  template:
    metadata:
      labels:
        app: docvault
        component: gateway
    spec:
      containers:
        - name: gateway
          image: dms-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: DOCUMENTS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: dms-config
                  key: DOCUMENTS_SERVICE_URL
            - name: COMMENTS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: dms-config
                  key: COMMENTS_SERVICE_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: dms-config
                  key: AUTH_SERVICE_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: docvault
  labels:
    app: docvault
    component: gateway
spec:
  type: NodePort
  selector:
    app: docvault
    component: gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: docvault
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
