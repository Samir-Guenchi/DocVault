# ═══════════════════════════════════════════════════════════
# Documents Service (Document Management + Redis + Kafka)
# ═══════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: documents-service
  namespace: docvault
  labels:
    app: docvault
    component: documents
spec:
  replicas: 3
  selector:
    matchLabels:
      app: docvault
      component: documents
  template:
    metadata:
      labels:
        app: docvault
        component: documents
    spec:
      containers:
        - name: documents-service
          image: dms-documents:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: dms-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: dms-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: dms-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: dms-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dms-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: dms-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: dms-config
                  key: REDIS_PORT
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: dms-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_TOPIC_DOCUMENTS_UPLOADED
              valueFrom:
                configMapKeyRef:
                  name: dms-config
                  key: KAFKA_TOPIC_DOCUMENTS_UPLOADED
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: dms-config
                  key: S3_ENDPOINT
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: dms-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dms-secrets
                  key: S3_SECRET_KEY
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: dms-config
                  key: S3_BUCKET
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: documents-service
  namespace: docvault
  labels:
    app: docvault
    component: documents
spec:
  type: ClusterIP
  selector:
    app: docvault
    component: documents
  ports:
    - port: 8081
      targetPort: 8081
      name: http

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: documents-service-hpa
  namespace: docvault
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: documents-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
