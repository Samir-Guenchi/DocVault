# ═══════════════════════════════════════════════════════════
# Persistent Volume Claims for Stateful Services
# ═══════════════════════════════════════════════════════════

---
# PostgreSQL (Documents) Storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: docvault
  labels:
    app: docvault
    component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

