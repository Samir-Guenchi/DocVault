server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: documents
          uri: ${DOCUMENTS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/documents/**
        - id: users
          uri: ${DOCUMENTS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**
        - id: categories
          uri: ${DOCUMENTS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/categories/**
        - id: departments
          uri: ${DOCUMENTS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/departments/**
        - id: comments
          uri: ${COMMENTS_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/comments/**
