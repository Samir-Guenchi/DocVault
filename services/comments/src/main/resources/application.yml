server:
  port: 8082

spring:
  application:
    name: comments-service
  
  cassandra:
    keyspace-name: ${CASSANDRA_KEYSPACE:dms}
    contact-points: ${CASSANDRA_HOST:localhost}
    port: ${CASSANDRA_PORT:9042}
    local-datacenter: ${CASSANDRA_DC:datacenter1}
    schema-action: create-if-not-exists

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.comments: INFO
    org.springframework.data.cassandra: INFO
