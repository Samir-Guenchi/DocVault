server:
  port: 8083

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/authdb
    username: ${DB_USER:authuser}
    password: ${DB_PASSWORD:authpass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:dms-secret-key-change-this-in-production-use-256-bit-key}
  expiration: 86400000 # 24 hours in milliseconds

logging:
  level:
    com.example.auth: DEBUG
    org.springframework.security: DEBUG
