server:
  port: 8081

spring:
  application:
    name: documents-service

  # PostgreSQL (production / docker)
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:dms}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

# Kafka Topics
kafka:
  topic:
    document-uploaded: ${KAFKA_TOPIC_DOCUMENTS_UPLOADED:dms.documents.uploaded}

# S3 / MinIO Configuration
s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  access-key: ${S3_ACCESS_KEY:minioadmin}
  secret-key: ${S3_SECRET_KEY:minioadmin}
  bucket: ${S3_BUCKET:dms-documents}

# JWT Configuration (must match Auth service)
jwt:
  secret: ${JWT_SECRET:dms-secret-key-change-this-in-production-use-256-bit-key}
  expiration: 86400000 # 24 hours in milliseconds
